services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: caderneta_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: caderneta
      POSTGRES_USER: caderneta
      POSTGRES_PASSWORD: caderneta_dev
    ports:
      - "5432:5432"
    volumes:
      - caderneta_pgdata:/var/lib/postgresql/data
      - ../../infra/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caderneta"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caderneta_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  caderneta_pgdata:
