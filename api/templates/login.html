{% extends "base.html" %}
{% block title %}Login — Caderneta{% endblock %}

{% block conteudo %}
<div style="max-width:400px; margin:4rem auto;">
  <div class="card">
    <h1 style="margin-bottom:1.5rem;">Entrar</h1>

    {% if erro %}
    <div class="alerta alerta-erro" id="msg-erro">{{ erro }}</div>
    {% endif %}

    <div id="msg-feedback"></div>

    <form
      hx-post="/login"
      hx-target="#msg-feedback"
      hx-on::after-request="if(event.detail.successful && event.detail.xhr.status===200) { window.location='/fila'; }"
    >
      <div class="campo">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="email"
          autofocus
          placeholder="contador@empresa.com"
        >
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primario" style="width:100%;">
        <span class="htmx-indicator spinner"></span>
        Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}
