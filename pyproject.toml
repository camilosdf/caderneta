[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

# =============================================================
# PROJETO
# =============================================================
[project]
name = "caderneta"
version = "0.3.3"
# Versionamento: FASE.ETAPA.REVISÃO — veja ADR 007
# 0 = pré-produção | 3 = Etapa 3 (Parsers) | 1 = primeira revisão
# Exibição formatada: v0.003.001
# Produção inicia em v1.000.000 — aprovação formal do CRC obrigatória
description = "Plataforma modular de automação contábil com IA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Dependências mínimas — sempre instaladas
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.0",
]

# =============================================================
# DEPENDÊNCIAS OPCIONAIS
# =============================================================
[project.optional-dependencies]

# Caderneta Core — lógica contábil determinística (sem IA)
core = [
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0.0",
    "lxml>=4.9.0",
    "ofxparse>=0.21",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "python-magic>=0.4.27",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "redis>=5.0.0",
]

# Caderneta AI — plugins de IA (instalação opcional)
# O Core nunca requer este grupo — veja ADR 001
ai = [
    "sentence-transformers>=2.3.0",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.2",
    "opencv-python-headless>=4.9.0",
    "httpx>=0.27.0",
]

# Desenvolvimento e testes
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "hatchling>=1.21.0",
]

# Instalação completa
all = ["caderneta[core,ai,dev]"]

# =============================================================
# ENTRYPOINTS
# =============================================================
[project.scripts]
caderneta = "core.cli:app"

# =============================================================
# HATCHLING — CONFIGURAÇÃO DE BUILD
# Informa explicitamente quais pacotes entram no wheel.
# Sem esta seção o Hatchling não consegue inferir a estrutura.
# =============================================================
[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "shared",
    "ai",
]

[tool.hatch.build.targets.sdist]
include = [
    "/core",
    "/shared",
    "/ai",
    "/tests",
    "/docs",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "/infra",
    "/.venv",
    "/__pycache__",
    "*.pyc",
]

# Modo editável — necessário para `pip install -e`
[tool.hatch.build.targets.wheel.hooks.mypyc]
enable-by-default = false

# =============================================================
# RUFF — linting e formatação
# =============================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# =============================================================
# MYPY — verificação de tipos
# =============================================================
[tool.mypy]
python_version = "3.11"
strict = true

# Core nunca importa AI — regra verificada pelo CI (ADR 001)
[[tool.mypy.overrides]]
module = "ai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ofxparse.*",
    "paddleocr.*",
    "paddle.*",
    "cv2.*",
    "fitz.*",
    "pdfplumber.*",
    "magic.*",
]
ignore_missing_imports = true

# =============================================================
# PYTEST
# =============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

# =============================================================
# COVERAGE
# =============================================================
[tool.coverage.run]
source = ["core", "ai"]
omit = [
    "tests/*",
    "infra/*",
    "*/ai/ocr/spike.py",
    # CLI e use_cases requerem ambiente completo (banco, arquivos reais)
    # Cobertos por testes de integração (Etapa 6), não unitários
    "core/cli.py",
    "core/application/use_cases/*.py",
    # Parsers herdados da v0.1 — migração completa na Etapa 3
    "core/motores_detector.py",
    "core/motores_parsers_ofx.py",
    "core/motores_parsers_csv.py",
]

[tool.coverage.report]
# Metas por etapa (ADR 007):
#   Etapa 1 (domínio)      → 90%+  ✅ (96%)
#   Etapa 4 (tax/rules)    → 90%+  ✅ (97%)
#   Etapa 5 (auditoria)    → 85%+  ✅ (92%)
#   Etapa 3 (parsers)      → 75%+  🔜 (novos testes)
#   Meta geral Etapa 3     → 75%
fail_under = 75
show_missing = true
skip_covered = false

[tool.coverage.paths]
source = ["core", "ai"]
